<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#flow-bg)" rx="20" stroke="#334155" stroke-width="1.5" />

  <!-- Flow Section Header -->
  <text x="600" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">
    🔄 「割了么」 闭环游戏流程
  </text>
  <text x="600" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    从持仓跳水到实业打工，再到谎言检测强制梭哈的荒诞闭环
  </text>

  <!-- Step 1: 首页 -->
  <g transform="translate(60, 100)">
    <rect width="180" height="150" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <text x="90" y="38" font-size="28" text-anchor="middle">📉</text>
    <text x="90" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1. 持仓跳水</text>
    <text x="90" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">拿不住了吗？</text>
    <text x="90" y="115" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle">-2.71% ➔ -8.43%</text>
    <text x="90" y="132" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">钻石手认证勋章</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M255 175 H285" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 4" />
  <polygon points="285,170 295,175 285,180" fill="#ef4444" />

  <!-- Step 2: 职业路径选择 -->
  <g transform="translate(315, 100)">
    <rect width="210" height="150" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="105" y="38" font-size="28" text-anchor="middle">🧰</text>
    <text x="105" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2. 重新规划路径</text>
    <text x="105" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">✂️ 割肉 (+19.98%暴涨)</text>
    <text x="105" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">🌾 拿锄头 | 🔧 拧螺丝</text>
    <text x="105" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">🛵 送外卖 (爬28楼)</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="540,170 550,175 540,180" fill="#f59e0b" />
  <path d="M530 175 H540" stroke="#f59e0b" stroke-width="3" />

  <!-- Step 3: 统一结算 & 谎言检测 -->
  <g transform="translate(560, 100)">
    <rect width="210" height="150" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="105" y="38" font-size="28" text-anchor="middle">💰</text>
    <text x="105" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3. 统一结算</text>
    <text x="105" y="95" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">本月到账 ￥3,842</text>
    <text x="105" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#f87171" text-anchor="middle">🚨 谎言检测：强行梭哈</text>
    <text x="105" y="133" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">残余本金: ￥12.80</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="785,170 795,175 785,180" fill="#3b82f6" />
  <path d="M775 175 H785" stroke="#3b82f6" stroke-width="3" />

  <!-- Step 4: 评估报告与闭环 -->
  <g transform="translate(805, 100)">
    <rect width="210" height="150" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <text x="105" y="38" font-size="28" text-anchor="middle">📜</text>
    <text x="105" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">4. 职业评估报告</text>
    <text x="105" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">🏆 动态生成专属称号</text>
    <text x="105" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">📸 html2canvas 截图保存</text>
    <text x="105" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="11" fill="#f43f5e" text-anchor="middle">🔄 再割一次 循环开局</text>
  </g>

  <!-- Bottom Return Loop Curve -->
  <path d="M910 255 V280 H150 V255" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" />
  <polygon points="145,260 150,250 155,260" fill="#64748b" />
</svg>
